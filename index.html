<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Практикум · колледж</title>
<meta name="theme-color" content="#F6F5F2">
<script>
/* Старые ссылки квиза Handoff (?r=… / ?host) ведут на /handoff/ */
(function () { var q = location.search; if (/[?&](r|host)(=|&|$)/.test(q) && !/[?&]sess=/.test(q)) location.replace("handoff/" + q + location.hash); })();
</script>
<style>
:root{--bg:#F6F5F2;--card:#fff;--ink:#1F2328;--mut:#6B6F76;--line:#E2E0DA;--acc:#2F6FB3;--acc2:#EEF3FB;--ok:#2E8B57;--okbg:#F2FAF5;--warn:#9A6A12;--warnbg:#FFF8EA;--bad:#C2413B;--badbg:#FCEFEE;--r:16px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--acc)}button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 90px}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:1080px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;text-decoration:none;color:var(--ink)}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--acc);display:grid;place-items:center;color:#fff;font-style:normal;font-size:18px}
.sp{flex:1}.mut{color:var(--mut)}.small{font-size:13px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.lang button{border:0;background:none;padding:6px 12px;font-size:13px;font-weight:700;color:var(--mut);cursor:pointer}.lang button.on{background:var(--ink);color:#fff}
h1{font-size:28px;line-height:1.2;margin:8px 0 6px}h2{font-size:21px;margin:0 0 10px}h3{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:0;background:var(--acc);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;font-size:16px}
.btn:disabled{opacity:.45;cursor:default}.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn.ok{background:var(--ok)}.btn.bad{background:#fff;color:var(--bad);border:1.5px solid #F2C2C9}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}.btn.wide{width:100%}
.big{display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;padding:22px;border-radius:20px;border:2px solid var(--line);background:#fff;cursor:pointer;text-align:left}
.big b{font-size:22px}.big:hover{border-color:var(--acc)}.big.main{background:#fff;border-color:var(--acc);box-shadow:0 2px 0 var(--acc)}.big.main b{color:var(--acc)}
input[type=text],input[type=search],select,textarea{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:17px}
textarea{min-height:160px;font-size:15px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
label.l{display:block;font-weight:700;margin:14px 0 6px}
.steps{display:flex;gap:6px;margin:4px 0 14px}.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--acc)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.names button{min-height:52px;text-align:left;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:16px;cursor:pointer}
.names button:hover{border-color:var(--acc);background:var(--acc2)}
.pin{display:flex;gap:10px;justify-content:center;margin:18px 0}.pin i{width:52px;height:60px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;font-size:28px;font-style:normal;font-weight:800;background:#fff}
.pin i.f{border-color:var(--acc)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto}
.pad button{min-height:62px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:24px;font-weight:700;cursor:pointer}
.pad button:active{background:var(--acc2)}
.err{color:var(--bad);font-weight:700;text-align:center;min-height:24px}
.live{border:2px solid #9FD3B5;background:var(--okbg)}.live .btn{margin-top:10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.3}}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;text-decoration:none;color:inherit}
.row:hover{border-color:var(--acc)}.row .t{flex:1;min-width:0}.row .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{min-width:58px;text-align:center;padding:6px 8px;border-radius:10px;font-weight:800;background:var(--acc2);color:var(--acc)}
.score.hi{background:var(--okbg);color:var(--ok)}.score.lo{background:var(--badbg);color:var(--bad)}.score.na{background:#F1F0EC;color:var(--mut)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 10px;padding-bottom:2px}
.tabs button{border:0;background:none;padding:10px 14px;border-radius:999px;font-weight:700;color:var(--mut);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--ink);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:720px){.grid2{grid-template-columns:1fr}}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mod{padding:14px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;text-align:left}
.mod b{display:block}.mod.on{border-color:var(--acc);background:var(--acc2);box-shadow:0 0 0 1px var(--acc) inset}.mod small{color:var(--mut)}
table.tb{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
table.tb th,table.tb td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
table.tb th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;background:#FAFAF7}
.tbw{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:70vh}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#F1F0EC;color:var(--mut)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.works a{display:block;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;text-decoration:none;color:inherit}
.works img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#eee}.works span{display:block;padding:6px 8px;font-size:12px}
.modal{position:fixed;inset:0;background:rgba(20,18,30,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal>div{background:var(--bg);width:100%;max-width:820px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}
@media (min-width:760px){.modal{align-items:center}.modal>div{border-radius:20px}}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:8px}.mh h2{margin:0;flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:99;font-weight:600;max-width:90vw}
.empty{padding:26px;text-align:center;color:var(--mut);border:2px dashed var(--line);border-radius:16px}
.tk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.tk:last-child{border:0}
.tk .n{width:28px;height:28px;border-radius:8px;background:#F1F0EC;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.tk .n.ok{background:var(--okbg);color:var(--ok)}
.cm{margin-top:6px;padding:8px 10px;border-radius:10px;background:var(--warnbg);font-size:14px}
.hero{display:grid;grid-template-columns:1fr;gap:12px;margin-top:10px}
.qr{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.qr svg,.qr img{width:150px;height:150px;background:#fff;border-radius:10px;padding:6px;border:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pcard{border:1.5px dashed #999;border-radius:10px;padding:10px;background:#fff;page-break-inside:avoid}
.pcard b{display:block;font-size:15px}.pcard .p{font-size:28px;font-weight:800;letter-spacing:6px;margin:4px 0}
@media print{body{background:#fff}.noprint{display:none!important}.wrap{padding:0}.modal{position:static;background:none}.modal>div{max-height:none;padding:0;background:#fff}}
.mockb{position:fixed;left:8px;bottom:8px;font-size:11px;background:#FEF4E2;color:#B45309;padding:3px 8px;border-radius:8px;z-index:5}
/* ---- classroom ---- */
.hdr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}.hdr h1{margin:0;flex:1;min-width:0}
.pc{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;text-decoration:none;color:inherit}
.pc:hover{border-color:var(--acc)}.pc .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--acc2)}
.pc .ic.m{background:#F3EFE6}.pc .t{flex:1;min-width:0}.pc .t b{display:block;font-size:17px;line-height:1.3}.pc .t .small{margin-top:3px}
.pc .st{flex:none;text-align:right}
.chip.blue{background:var(--acc2);color:var(--acc)}
.sect{margin:18px 0 8px;font-size:13px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.box h3{margin:0 0 8px}
.goal2{background:var(--warnbg);border:1px solid #F1DFB7;border-radius:14px;padding:12px 14px;margin:10px 0}
.goal2 b{display:block;font-size:12px;color:var(--warn);text-transform:uppercase;letter-spacing:.05em}
.stp ol{padding-left:22px;margin:0}.stp li{margin:0 0 12px;line-height:1.55}
.stp .one{font-size:18px;line-height:1.55;min-height:60px}
.stpdots{display:flex;gap:5px;margin:4px 0 12px}.stpdots i{flex:1;height:6px;border-radius:9px;background:#E6E4DE;cursor:pointer}.stpdots i.d{background:#9FD3B5}.stpdots i.c{background:var(--acc)}
.mp{background:#EEF3FB;border:1px solid #D3E0F3;color:#1F3F6B;border-radius:7px;padding:1px 6px;font-weight:600;box-decoration-break:clone;-webkit-box-decoration-break:clone}
kbd{display:inline-block;font:600 .85em/1.3 ui-monospace,Menlo,Consolas,monospace;padding:1px 6px;border-radius:6px;border:1px solid #CFCDC6;border-bottom-width:2px;background:#fff;white-space:nowrap}
.simg{display:block;margin:8px 0;border-radius:10px;overflow:hidden;border:1px solid var(--line)}.simg img{display:block;width:100%}
.exim{width:100%;border-radius:12px;border:1px solid var(--line);display:block;background:#fff}
details.dd{border:1px solid var(--line);border-radius:12px;background:#fff;margin:8px 0}details.dd>summary{padding:12px 14px;cursor:pointer;font-weight:700}details.dd>div{padding:0 14px 12px}
.subbox{border:2px solid #9FD3B5;background:var(--okbg);border-radius:16px;padding:16px;margin:16px 0}
.subbox.graded{border-color:#B9D0F0;background:#F4F8FE}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.thumbs div{position:relative}.thumbs img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;background:#fff}
.thumbs button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:13px;cursor:pointer}
.pick{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:64px;border:2px dashed #BFD3C7;border-radius:14px;background:#fff;font-weight:700;cursor:pointer;color:var(--ok)}
.big-score{font-size:34px;font-weight:800;line-height:1}
.chk{display:flex;align-items:center;gap:8px;margin:8px 0}.chk label{flex:1}.chk input,.chk select{max-width:180px;min-height:44px}
.chk .r{width:26px;text-align:center;font-weight:800}.chk.ok .r{color:var(--ok)}.chk.no .r{color:var(--bad)}
.ans{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
.files{display:flex;flex-direction:column;gap:8px;margin:10px 0}.file{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.file .fi{width:38px;height:44px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:#C2413B;flex:none}.file .fi.w{background:#2F6FB3}.file .fi.o{background:#6B6F76}
.file .t{flex:1;min-width:0}.file .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtext{white-space:pre-wrap;line-height:1.6}
.yt{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;margin:10px 0}.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.gb{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.gb button{min-height:44px;min-width:56px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:16px;cursor:pointer}
.gb button.on{border-color:var(--acc);background:var(--acc2);color:var(--acc)}
.rv{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}@media (max-width:800px){.rv{grid-template-columns:1fr}}
.rvimgs img{width:100%;border-radius:10px;border:1px solid var(--line);margin-bottom:8px;display:block;background:#fff}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;max-height:58vh;overflow:auto;padding:2px}
.bk{border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;overflow:hidden;text-align:left;padding:0}
.bk img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#F1F0EC}.bk div{padding:8px 10px;font-size:14px;font-weight:700;line-height:1.3}.bk.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.cnt{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;font-weight:800;margin-left:4px}
.jt td.s{text-align:center;font-weight:700}.jt td.s.sub{color:var(--warn)}.jt td.s.na{color:#B8B6AF}
.fab{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.stabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#ECEBE6;border-radius:14px;padding:4px}.stabs button{padding:10px 4px;border-radius:10px;text-align:center}.stabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
</style>
</head>
<body>
<div class="top noprint"><a class="logo" href="#/"><i>✦</i><span id="brand">Практикум</span></a><div class="sp"></div>
  <div class="lang"><button data-lg="kk">ҚАЗ</button><button data-lg="ru">РУС</button></div></div>
<div class="wrap" id="app"><p class="mut">Жүктелуде… / Загрузка…</p></div>
<script src="mqtt.min.js"></script>
<script src="fb/config.js"></script>
<script>
(function () {
  if (!window.FB_CONFIG || /[?&]mock/.test(location.search)) return;
  ["fb/firebase-app-compat.js", "fb/firebase-auth-compat.js", "fb/firebase-firestore-compat.js"].forEach(function (s) { document.write('<script src="' + s + '"><\/script>'); });
})();
</script>
<script src="fb/db.js"></script>
<script src="fb/qrcode.js"></script>
<script>
"use strict";
/* ================= Общее ================= */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const app = $("#app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
let LG = localStorage.getItem("portal_lang") || "kk";
const T = (kk, ru) => LG === "kk" ? kk : ru;
const LS = {get: k => { try { return JSON.parse(localStorage.getItem("portal_" + k)); } catch (e) { return null; } }, set: (k, v) => localStorage.setItem("portal_" + k, JSON.stringify(v)), del: k => localStorage.removeItem("portal_" + k)};
const toast = t => { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2800); };
const MON = {kk: ["қаң", "ақп", "нау", "сәу", "мам", "мау", "шіл", "там", "қыр", "қаз", "қар", "жел"], ru: ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"]};
const fmtD = ts => { if (!ts) return ""; const d = new Date(ts); return `${d.getDate()} ${MON[LG][d.getMonth()]} ${d.getFullYear()}`; };
const fmtDS = ts => { if (!ts) return ""; const d = new Date(ts); return `${d.getDate()} ${MON[LG][d.getMonth()]}`; };
const fmtDT = ts => { if (!ts) return ""; const d = new Date(ts); return `${d.getDate()} ${MON[LG][d.getMonth()]}, ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
const PROJ = (window.FB_CONFIG && FB_CONFIG.projectId) || "mock";
const emailFor = (gid, sid, v) => `${gid}.${sid}${v ? "." + v : ""}@stud-${PROJ}.app`.toLowerCase();
const pwFor = pin => `kz-${pin}-pin`;
const normCode = s => String(s || "").toUpperCase().replace(/[\s\-_.\/]/g, "").slice(0, 16);
const pin4 = () => String(Math.floor(1000 + Math.random() * 9000));
const scoreCls = p => p == null ? "na" : p >= 85 ? "hi" : p < 50 ? "lo" : "";
const EXTRA = DB.mock ? location.search.replace(/^\?/, "").split("&").filter(x => /^(mock|broker)/.test(x)).join("&") : "";
const withX = u => EXTRA ? u + (u.includes("?") ? "&" : "?") + EXTRA : u;
const BASE = location.origin + location.pathname.replace(/index\.html$/, "");
const MODS = [
  {slug: "photoshop", name: "Photoshop", j: true}, {slug: "illustrator", name: "Illustrator", j: true},
  {slug: "diagrammy", name: "Excel · Диаграммы", j: true}, {slug: "sortirovka", name: "Excel · Сортировка", j: true},
  {slug: "excel", name: "Excel · «Что если»", j: false}, {slug: "handoff", name: "Handoff · квиз", j: false}];
const modOf = s => MODS.find(m => m.slug === s) || {name: s};
let UNSUB = [];
const keep = f => { UNSUB.push(f); return f; };
const unsubAll = () => { UNSUB.forEach(f => { try { f(); } catch (e) {} }); UNSUB = []; };
function modal(html, onClose) {
  const m = document.createElement("div"); m.className = "modal"; m.innerHTML = `<div>${html}</div>`; document.body.appendChild(m);
  const close = () => { m.remove(); onClose && onClose(); };
  m.addEventListener("click", e => { if (e.target === m || e.target.closest("[data-x]")) close(); });
  return {el: m, close, q: s => m.querySelector(s)};
}
function qrSvg(text) { try { const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({cellSize: 4, margin: 2, scalable: true}); } catch (e) { return ""; } }
const linkify = t => esc(t).replace(/(https?:\/\/[^\s<]+)/g, u => `<a href="${u}" target="_blank" rel="noopener">${u.length > 60 ? u.slice(0, 57) + "…" : u}</a>`);
const ytId = u => { const m = String(u).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/); return m ? m[1] : null; };
/* шаги из банка: [[ru|en]], {{img:x}}, клавиши */
function fmtStep(x, lg, base) {
  return esc(String(x == null ? "" : x).replace(/\[\[([^|\]]*)\|([^\]]*)\]\]/g, (m, a, b) => "\u0001" + (lg === "en" ? b : a) + "\u0002"))
    .replace(/\u0001([^\u0002]*)\u0002/g, (m, p) => `<span class="mp">${p.replace(/ → /g, " › ")}</span>`)
    .replace(/((?:Ctrl|Alt|Shift|Cmd)(?:\+[A-Za-zА-Яа-я0-9\[\]↓↑]+)+)/g, "<kbd>$1</kbd>")
    .replace(/\s*\{\{img:([\w-]+)\}\}/g, (m, n) => `<a class="simg" href="${base}${n}.jpg" target="_blank"><img src="${base}${n}.jpg" alt="" loading="lazy"></a>`)
    .replace(/(https?:\/\/[^\s<,)»]+)/g, u => `<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "")}</a>`);

/* счётчик непроверенных: подписка на subs и marks каждого студента */
function watchGroupSubs(gid, cb) {
  const st = {studs: [], subs: {}, marks: {}}, inner = [];
  const emit = () => cb(st);
  keep(DB.col(`groups/${gid}/students`).on(list => {
    inner.splice(0).forEach(f => f()); st.studs = list.filter(s => !s.off).sort((a, b) => a.name.localeCompare(b.name, "ru")); st.subs = {}; st.marks = {};
    st.studs.forEach(s => { inner.push(DB.col(`groups/${gid}/students/${s.id}/subs`).on(l => { st.subs[s.id] = {}; l.forEach(x => st.subs[s.id][x.id] = x); emit(); }));
      inner.push(DB.col(`groups/${gid}/students/${s.id}/marks`).on(l => { st.marks[s.id] = {}; l.forEach(x => st.marks[s.id][x.id] = x); emit(); })); });
    emit(); }));
  keep(() => inner.forEach(f => f()));
}
const pendingOf = st => { const out = []; st.studs.forEach(s => Object.values(st.subs[s.id] || {}).forEach(x => { const m = (st.marks[s.id] || {})[x.id]; if (!m || (m.at || 0) < (x.at || 0)) out.push({s, sub: x}); })); return out.sort((a, b) => (a.sub.at || 0) - (b.sub.at || 0)); };

}
function csvDownload(name, rows) {
  const csv = "﻿" + rows.map(r => r.map(v => { const s = v == null ? "" : String(v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(";")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv;charset=utf-8"})); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
/* ---------- Студенты ---------- */
async function gStudents(g, S) {
  const el = $("#tv"), studs = S.gs.studs, secrets = {};
  el.innerHTML = `<div class="fab noprint"><button class="btn sm" id="add">+ ${T("Студенттер қосу", "Добавить студентов")}</button><button class="btn ghost sm" id="cards">🖨 ${T("PIN карточкалары", "Карточки с PIN")}</button></div><div id="stl"></div>`;
  try { (await DB.col(`groups/${g.id}/secrets`).get()).forEach(s => secrets[s.id] = s.pin); } catch (e) {}
  const draw = () => { $("#stl").innerHTML = !studs.length ? `<div class="empty">${T("Студенттер жоқ. «Студенттер қосу» басып, тізімді Excel-ден қойыңыз.", "Студентов нет. Нажмите «Добавить студентов» и вставьте список из Excel.")}</div>`
    : `<div class="tbw"><table class="tb"><tr><th>№</th><th>${T("Аты-жөні", "ФИО")}</th><th>PIN</th><th></th></tr>${studs.map((s, i) => `<tr><td>${i + 1}</td><td>${esc(s.name)}</td><td><a href="#" data-pin="${s.id}">••••</a></td><td style="white-space:nowrap"><button class="btn ghost sm" data-reset="${s.id}">${T("Жаңа PIN", "Новый PIN")}</button> <button class="btn bad sm" data-del="${s.id}">✕</button></td></tr>`).join("")}</table></div>`;
    $$("[data-pin]").forEach(b => b.onclick = e => { e.preventDefault(); b.textContent = b.textContent === "••••" ? (secrets[b.dataset.pin] || "?") : "••••"; });
    $$("[data-del]").forEach(b => b.onclick = async () => { const s = studs.find(x => x.id === b.dataset.del); if (!confirm(T(`${s.name} тізімнен алынсын ба? Тарихы сақталады.`, `Убрать ${s.name} из списка? История сохранится.`))) return; await DB.doc(`groups/${g.id}/students/${s.id}`).set({off: true}, true); });
    $$("[data-reset]").forEach(b => b.onclick = async () => { const s = studs.find(x => x.id === b.dataset.reset); b.disabled = true;
      try { const pin = pin4(), v = (s.v || 0) + 1, email = emailFor(g.id, s.id, v); await DB.auth.create(email, pwFor(pin)); await DB.doc(`groups/${g.id}/students/${s.id}`).set({email, v}, true); await DB.doc(`groups/${g.id}/secrets/${s.id}`).set({pin}); secrets[s.id] = pin; toast(`${s.name}: PIN ${pin}`); } catch (e) { toast(e.message); b.disabled = false; } }); };
  draw();
  $("#add").onclick = () => { const md = modal(`<div class="mh"><h2>${T("Студенттер қосу", "Добавить студентов")}</h2><button class="btn ghost sm" data-x>✕</button></div>
      <p class="mut small">${T("Excel-ден аты-жөндер бағанын көшіріп қойыңыз — әр жолға бір студент. PIN автоматты беріледі.", "Скопируйте столбец ФИО из Excel и вставьте — по одному студенту в строке. PIN выдаётся автоматически.")}</p>
      <textarea id="ta" placeholder="Ахметов Ержан&#10;Иванова Анна&#10;…"></textarea><div id="pr" class="mut small" style="margin:8px 0"></div><button class="btn wide" id="ok">${T("Қосу", "Добавить")}</button>`);
    md.q("#ok").onclick = async () => { const names = md.q("#ta").value.split(/\r?\n/).map(x => x.split("\t")[0].replace(/\s+/g, " ").trim()).filter(x => x && x.length < 60);
      const have = new Set(studs.map(s => s.name.toLowerCase())), todo = names.filter(n => !have.has(n.toLowerCase())); if (!todo.length) { toast(T("Жаңа аты жоқ", "Новых имён нет")); return; }
      md.q("#ok").disabled = true; let n = 0;
      for (const name of todo) { const sid = DB.id(), pin = pin4(), email = emailFor(g.id, sid);
        try { await DB.auth.create(email, pwFor(pin)); await DB.doc(`groups/${g.id}/students/${sid}`).set({name, email, created: Date.now()}); await DB.doc(`groups/${g.id}/secrets/${sid}`).set({pin}); n++; md.q("#pr").textContent = `${n} / ${todo.length}`; }
        catch (e) { md.q("#pr").insertAdjacentHTML("beforeend", `<div style="color:var(--bad)">${esc(name)}: ${esc(e.message)}</div>`); } }
      toast(T(`${n} студент қосылды`, `Добавлено: ${n}`)); md.close(); }; };
  $("#cards").onclick = () => { const md = modal(`<div class="mh noprint"><h2>${T("PIN карточкалары", "Карточки с PIN")}</h2><button class="btn sm" id="pp">🖨 ${T("Басып шығару", "Печать")}</button><button class="btn ghost sm" data-x>✕</button></div>
      <div class="cards">${studs.map(s => `<div class="pcard"><b>${esc(s.name)}</b><div class="small">${esc(BASE.replace(/^https?:\/\//, ""))}</div><div class="small">${T("Топ коды", "Код группы")}: <b>${esc(g.code)}</b></div><div class="p">${esc(secrets[s.id] || "????")}</div><div class="small mut">PIN — ${T("ешкімге көрсетпеңіз", "никому не показывайте")}</div></div>`).join("")}</div>`);
    md.q("#pp").onclick = () => window.print(); };
}
/* ---------- Пара: квиз / практика вживую ---------- */
function liveStart(g) {
  const md = modal(`<div class="mh"><h2>▶ ${T("Сабақта: квиз / практика", "На паре: квиз / практика")}</h2><button class="btn ghost sm" data-x>✕</button></div>
    <p class="mut small">${T("Тікелей режим: сіз экраннан басқарасыз, студенттер кабинетінде «Кіру» батырмасын көреді.", "Живой режим: вы ведёте с экрана, студенты видят кнопку «Войти» в своём кабинете.")}</p>
    <div class="mods">${MODS.map(m => `<button class="mod" data-m="${m.slug}"><b>${esc(m.name)}</b><small>${m.j ? T("журналға сақталады", "сохраняется в журнал") : T("журналсыз", "без журнала")}</small></button>`).join("")}</div>
    <label class="l">${T("Атауы", "Название")}</label><input type="text" id="lt" placeholder="${T("Мысалы: Квиз — 3D Mapping", "Например: Квиз — сортировка")}"><button class="btn wide" id="lg" style="margin-top:12px">▶ ${T("Бастау", "Начать")}</button>`);
  let mod = null; md.el.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { mod = b.dataset.m; md.el.querySelectorAll("[data-m]").forEach(x => x.classList.toggle("on", x === b)); });
  md.q("#lg").onclick = async () => { if (!mod) { toast(T("Модульді таңдаңыз", "Выберите модуль")); return; } const m = modOf(mod), title = md.q("#lt").value.trim() || m.name;
    if (!m.j) { window.open(withX(`${mod}/?host`), "_blank"); md.close(); return; }
    const w = window.open("about:blank", "_blank"), id = DB.id(); await DB.doc("sessions/" + id).set({gid: g.id, gname: g.name, slug: mod, title, date: Date.now(), status: "live"});
    const url = withX(`${mod}/?host&sess=${id}`); if (w) w.location = url; else location.href = url; md.close(); };
}
function tLive() { location.hash = "#/t"; }
function tHist() {
  app.innerHTML = tTop(T("Сабақтар тарихы", "История пар"), "#/t") + `<div class="list">${TD.sessions.map(s => `<a class="row" href="#/t/hist/${s.id}"><div class="score ${scoreCls(s.avg)}">${s.avg != null ? s.avg : "—"}</div><div class="t"><b>${esc(s.title)}</b><span class="mut small">${esc(s.gname || "")} · ${fmtDT(s.date)} · ${s.n || 0} ${T("студент", "студ.")}</span></div>${s.status === "live" ? `<span class="chip ok">live</span>` : ""}<span class="mut">›</span></a>`).join("") || `<div class="empty">${T("Әзірге жоқ", "Пока нет")}</div>`}</div>`;
  bindTop();
}
async function tSession(id) {
  const s = TD.sessions.find(x => x.id === id); if (!s) { app.innerHTML = `<div class="empty">—</div>`; return; }
  app.innerHTML = tTop(esc(s.title), "#/t/hist") + `<div class="mut">${esc(s.gname || "")} · ${fmtDT(s.date)}</div><div id="sv"><p class="mut">${T("Жүктелуде…", "Загрузка…")}</p></div>`; bindTop();
  const [res, studs] = await Promise.all([DB.col(`sessions/${id}/results`).get(), DB.col(`groups/${s.gid}/students`).get()]);
  const by = {}; res.forEach(r => by[r.id] = r); const roster = studs.filter(x => !x.off || by[x.id]).sort((a, b) => a.name.localeCompare(b.name, "ru")); const tasks = (res.find(r => r.tasks) || {}).tasks || [];
  $("#sv").innerHTML = `<div class="fab"><span class="chip ok">${T("Келді", "Пришли")}: ${res.length}</span><span class="chip">${T("Келмеді", "Не было")}: ${roster.length - res.length}</span><button class="btn ghost sm" id="wk">🖼 ${T("Жұмыстар", "Работы")}</button>${s.status === "live" ? `<a class="btn sm" target="_blank" href="${withX(`${s.slug}/?host&sess=${s.id}`)}">${T("Пульт", "Пульт")}</a>` : ""}</div>
    <div class="tbw"><table class="tb"><tr><th>${T("Студент", "Студент")}</th><th>/100</th>${tasks.map((t, k) => `<th title="${esc(t.title)}">${k + 1}</th>`).join("")}</tr>${roster.map(st => { const r = by[st.id]; if (!r) return `<tr><td>${esc(st.name)}</td><td colspan="${tasks.length + 1}"><span class="chip warn">${T("келмеді", "не был")}</span></td></tr>`;
      return `<tr><td>${esc(st.name)}</td><td><span class="score ${scoreCls(r.p100)}">${r.p100 != null ? r.p100 : r.score || 0}</span></td>${tasks.map((t, k) => { const x = (r.tasks || [])[k] || {}; return `<td>${x.tg ? `<b>${esc(x.tg)}</b>` : x.ag ? esc(x.ag) : x.done ? "✓" : "·"}</td>`; }).join("")}</tr>`; }).join("")}</table></div><div id="wv"></div>`;
  $("#wk").onclick = async () => { const ws = await DB.col(`sessions/${id}/works`).get(); $("#wv").innerHTML = ws.length ? `<div class="works" style="margin-top:12px">${ws.map(w => `<a href="${w.data}" target="_blank"><img src="${w.data}" loading="lazy"><span><b>${esc(w.name)}</b><br>${esc(w.task || "")}</span></a>`).join("")}</div>` : `<div class="empty">—</div>`; };
}

DB.ready.then(() => { route(); DB.auth.onChange(() => { if (/^#\/t/.test(location.hash)) route(); }); }).catch(e => app.innerHTML = `<div class="card">${esc(e.message || e)}</div>`);

</script>
