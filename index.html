<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Практикум · колледж</title>
<meta name="theme-color" content="#F6F5F1">
<script>
/* Старые ссылки квиза Handoff (?r=… / ?host) ведут на /handoff/ */
(function () { var q = location.search; if (/[?&](r|host)(=|&|$)/.test(q) && !/[?&]sess=/.test(q)) location.replace("handoff/" + q + location.hash); })();
</script>
<style>
:root{--bg:#F6F5F1;--card:#fff;--ink:#1C1B22;--mut:#6B6A75;--line:#E4E2DA;--acc:#4F46E5;--acc2:#EEF0FF;--ok:#13894B;--okbg:#E7F6EE;--warn:#B45309;--warnbg:#FEF4E2;--bad:#C2253A;--badbg:#FDECEE;--r:16px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--acc)}button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 90px}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:1080px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;text-decoration:none;color:var(--ink)}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--acc);display:grid;place-items:center;color:#fff;font-style:normal;font-size:18px}
.sp{flex:1}.mut{color:var(--mut)}.small{font-size:13px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.lang button{border:0;background:none;padding:6px 12px;font-size:13px;font-weight:700;color:var(--mut);cursor:pointer}.lang button.on{background:var(--ink);color:#fff}
h1{font-size:28px;line-height:1.2;margin:8px 0 6px}h2{font-size:21px;margin:0 0 10px}h3{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:0;background:var(--acc);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;font-size:16px}
.btn:disabled{opacity:.45;cursor:default}.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn.ok{background:var(--ok)}.btn.bad{background:#fff;color:var(--bad);border:1.5px solid #F2C2C9}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}.btn.wide{width:100%}
.big{display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;padding:22px;border-radius:20px;border:2px solid var(--line);background:#fff;cursor:pointer;text-align:left}
.big b{font-size:22px}.big:hover{border-color:var(--acc)}.big.main{background:var(--acc);border-color:var(--acc);color:#fff}.big.main .mut{color:#DCDDFE}
input[type=text],input[type=search],select,textarea{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:17px}
textarea{min-height:160px;font-size:15px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
label.l{display:block;font-weight:700;margin:14px 0 6px}
.steps{display:flex;gap:6px;margin:4px 0 14px}.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--acc)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.names button{min-height:52px;text-align:left;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:16px;cursor:pointer}
.names button:hover{border-color:var(--acc);background:var(--acc2)}
.pin{display:flex;gap:10px;justify-content:center;margin:18px 0}.pin i{width:52px;height:60px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;font-size:28px;font-style:normal;font-weight:800;background:#fff}
.pin i.f{border-color:var(--acc)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto}
.pad button{min-height:62px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:24px;font-weight:700;cursor:pointer}
.pad button:active{background:var(--acc2)}
.err{color:var(--bad);font-weight:700;text-align:center;min-height:24px}
.live{border:2px solid var(--ok);background:var(--okbg)}.live .btn{margin-top:10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.3}}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;text-decoration:none;color:inherit}
.row:hover{border-color:var(--acc)}.row .t{flex:1;min-width:0}.row .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{min-width:58px;text-align:center;padding:6px 8px;border-radius:10px;font-weight:800;background:var(--acc2);color:var(--acc)}
.score.hi{background:var(--okbg);color:var(--ok)}.score.lo{background:var(--badbg);color:var(--bad)}.score.na{background:#F1F0EC;color:var(--mut)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 10px;padding-bottom:2px}
.tabs button{border:0;background:none;padding:10px 14px;border-radius:999px;font-weight:700;color:var(--mut);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--ink);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:720px){.grid2{grid-template-columns:1fr}}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mod{padding:14px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;text-align:left}
.mod b{display:block}.mod.on{border-color:var(--acc);background:var(--acc2)}.mod small{color:var(--mut)}
table.tb{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
table.tb th,table.tb td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
table.tb th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;background:#FAFAF7}
.tbw{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:70vh}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#F1F0EC;color:var(--mut)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.works a{display:block;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;text-decoration:none;color:inherit}
.works img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#eee}.works span{display:block;padding:6px 8px;font-size:12px}
.modal{position:fixed;inset:0;background:rgba(20,18,30,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal>div{background:var(--bg);width:100%;max-width:820px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}
@media (min-width:760px){.modal{align-items:center}.modal>div{border-radius:20px}}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:8px}.mh h2{margin:0;flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:99;font-weight:600;max-width:90vw}
.empty{padding:26px;text-align:center;color:var(--mut);border:2px dashed var(--line);border-radius:16px}
.tk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.tk:last-child{border:0}
.tk .n{width:28px;height:28px;border-radius:8px;background:#F1F0EC;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.tk .n.ok{background:var(--okbg);color:var(--ok)}
.cm{margin-top:6px;padding:8px 10px;border-radius:10px;background:var(--warnbg);font-size:14px}
.hero{display:grid;grid-template-columns:1fr;gap:12px;margin-top:10px}
.qr{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.qr svg,.qr img{width:150px;height:150px;background:#fff;border-radius:10px;padding:6px;border:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pcard{border:1.5px dashed #999;border-radius:10px;padding:10px;background:#fff;page-break-inside:avoid}
.pcard b{display:block;font-size:15px}.pcard .p{font-size:28px;font-weight:800;letter-spacing:6px;margin:4px 0}
@media print{body{background:#fff}.noprint{display:none!important}.wrap{padding:0}.modal{position:static;background:none}.modal>div{max-height:none;padding:0;background:#fff}}
.mockb{position:fixed;left:8px;bottom:8px;font-size:11px;background:#FEF4E2;color:#B45309;padding:3px 8px;border-radius:8px;z-index:5}
</style>
</head>
<body>
<div class="top noprint"><a class="logo" href="#/"><i>✦</i><span id="brand">Практикум</span></a><div class="sp"></div>
  <div class="lang"><button data-lg="kk">ҚАЗ</button><button data-lg="ru">РУС</button></div></div>
<div class="wrap" id="app"><p class="mut">Жүктелуде… / Загрузка…</p></div>
<script src="mqtt.min.js"></script>
<script src="fb/config.js"></script>
<script>
(function () {
  if (!window.FB_CONFIG || /[?&]mock/.test(location.search)) return;
  ["fb/firebase-app-compat.js", "fb/firebase-auth-compat.js", "fb/firebase-firestore-compat.js"].forEach(function (s) { document.write('<script src="' + s + '"><\/script>'); });
})();
</script>
<script src="fb/db.js"></script>
<script src="fb/qrcode.js"></script>
<script>
"use strict";
/* ============ Общее ============ */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const app = $("#app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
let LG = localStorage.getItem("portal_lang") || "kk";
const T = (kk, ru) => LG === "kk" ? kk : ru;
const LS = {get: k => { try { return JSON.parse(localStorage.getItem("portal_" + k)); } catch (e) { return null; } }, set: (k, v) => localStorage.setItem("portal_" + k, JSON.stringify(v)), del: k => localStorage.removeItem("portal_" + k)};
const toast = t => { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2800); };
const MON = {kk: ["қаң", "ақп", "нау", "сәу", "мам", "мау", "шіл", "там", "қыр", "қаз", "қар", "жел"], ru: ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"]};
const fmtD = ts => { if (!ts) return ""; const d = new Date(ts); return `${d.getDate()} ${MON[LG][d.getMonth()]} ${d.getFullYear()}`; };
const fmtDT = ts => { if (!ts) return ""; const d = new Date(ts); return `${d.getDate()} ${MON[LG][d.getMonth()]}, ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
const PROJ = (window.FB_CONFIG && FB_CONFIG.projectId) || "mock";
const emailFor = (gid, sid, v) => `${gid}.${sid}${v ? "." + v : ""}@stud-${PROJ}.app`.toLowerCase();
const pwFor = pin => `kz-${pin}-pin`;
const normCode = s => String(s || "").toUpperCase().replace(/[\s\-_.\/]/g, "").slice(0, 16);
const pin4 = () => String(Math.floor(1000 + Math.random() * 9000));
const scoreCls = p => p == null ? "na" : p >= 85 ? "hi" : p < 50 ? "lo" : "";
const EXTRA = DB.mock ? location.search.replace(/^\?/, "").split("&").filter(x => /^(mock|broker)/.test(x)).join("&") : "";
const withX = u => EXTRA ? u + (u.includes("?") ? "&" : "?") + EXTRA : u;
const MODS = [
  {slug: "photoshop", name: "Photoshop", sub: T("Практика · ОН 2.1", "Практика · ОН 2.1"), j: true},
  {slug: "illustrator", name: "Illustrator", sub: T("Практика · ОН 2.2 · 3D", "Практика · ОН 2.2 · 3D"), j: true},
  {slug: "diagrammy", name: "Excel · Диаграммы", sub: T("№19 практика", "Практика №19"), j: true},
  {slug: "sortirovka", name: "Excel · Сортировка", sub: T("№20 практика", "Практика №20"), j: true},
  {slug: "excel", name: "Excel · «Что если»", sub: T("Квиз + практика · журналсыз", "Квиз + практика · без журнала"), j: false},
  {slug: "handoff", name: "Handoff · квиз", sub: T("Photoshop квиз · журналсыз", "Квиз Photoshop · без журнала"), j: false}];
const modOf = s => MODS.find(m => m.slug === s) || {name: s, sub: ""};
function modal(html, onClose) {
  const m = document.createElement("div"); m.className = "modal"; m.innerHTML = `<div>${html}</div>`; document.body.appendChild(m);
  const close = () => { m.remove(); onClose && onClose(); };
  m.addEventListener("click", e => { if (e.target === m || e.target.closest("[data-x]")) close(); });
  return {el: m, close};
}
function qrSvg(text) { try { const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({cellSize: 4, margin: 2, scalable: true}); } catch (e) { return ""; } }
const BASE = location.origin + location.pathname.replace(/index\.html$/, "");
let UNSUB = [];
const unsubAll = () => { UNSUB.forEach(f => { try { f(); } catch (e) {} }); UNSUB = []; };

function setLang(l) { LG = l; localStorage.setItem("portal_lang", l); document.documentElement.lang = l; $$(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lg === l)); route(); }
$$(".lang button").forEach(b => b.onclick = () => setLang(b.dataset.lg));
$$(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lg === LG));
if (DB.mock) { const d = document.createElement("div"); d.className = "mockb"; d.textContent = "тестовая база"; document.body.appendChild(d); }

/* ============ Маршруты ============ */
function route() {
  unsubAll();
  const h = location.hash.replace(/^#\/?/, "").split("/");
  const me = LS.get("me");
  if (h[0] === "s") return studentLogin();
  if (h[0] === "me") return me ? studentHome(me) : (location.hash = "#/s");
  if (h[0] === "t") return teacher(h.slice(1));
  if (me && h[0] === "") return (location.hash = "#/me");
  landing();
}
window.addEventListener("hashchange", route);

function landing() {
  app.innerHTML = `<h1>${T("Сәлем! 👋", "Здравствуйте! 👋")}</h1><p class="mut">${T("Сабаққа кіру үшін төмендегі батырманы басыңыз.", "Чтобы войти на занятие, нажмите кнопку ниже.")}</p>
    <div class="hero"><button class="big main" id="go-s"><b>🎓 ${T("Мен студентпін", "Я студент")}</b><span class="mut">${T("Топ коды → атың → PIN", "Код группы → имя → PIN")}</span></button>
    <button class="big" id="go-t"><b>👩‍🏫 ${T("Мен оқытушымын", "Я преподаватель")}</b><span class="mut">${T("Топтар, сабақтар, журнал", "Группы, занятия, журнал")}</span></button></div>`;
  $("#go-s").onclick = () => location.hash = "#/s"; $("#go-t").onclick = () => location.hash = "#/t";
}

/* ============ Студент: вход ============ */
function studentLogin() {
  const st = {step: 0, code: LS.get("lastCode") || "", gid: null, gname: "", list: [], pick: null, pin: ""};
  const bar = n => `<div class="steps">${[0, 1, 2].map(i => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</div>`;
  const draw = () => {
    if (st.step === 0) {
      app.innerHTML = `${bar(0)}<h1>${T("Топ коды", "Код группы")}</h1><p class="mut">${T("Кодты оқытушы береді (мысалы: БУХ22).", "Код даёт преподаватель (например: БУХ22).")}</p>
        <input type="text" id="code" autocomplete="off" autocapitalize="characters" value="${esc(st.code)}" placeholder="БУХ22" style="font-size:24px;text-align:center;letter-spacing:3px">
        <div class="err" id="err"></div><button class="btn wide" id="nx">${T("Әрі қарай →", "Далее →")}</button>
        <p style="text-align:center"><a href="#/">← ${T("Артқа", "Назад")}</a></p>`;
      const go = async () => { const c = normCode($("#code").value); if (!c) return; $("#nx").disabled = true; $("#err").textContent = "";
        try { const r = await DB.doc("codes/" + c).get(); if (!r) { $("#err").textContent = T("Мұндай топ жоқ. Кодты тексеріңіз.", "Такой группы нет. Проверьте код."); $("#nx").disabled = false; return; }
          const g = await DB.doc("groups/" + r.gid).get(); st.code = c; st.gid = r.gid; st.gname = g ? g.name : c;
          st.list = (await DB.col(`groups/${r.gid}/students`).get()).filter(s => !s.off).sort((a, b) => a.name.localeCompare(b.name, "ru")); LS.set("lastCode", c); st.step = 1; draw();
        } catch (e) { $("#err").textContent = T("Байланыс қатесі. Қайталаңыз.", "Ошибка связи. Повторите.") ; $("#nx").disabled = false; } };
      $("#nx").onclick = go; $("#code").onkeydown = e => { if (e.key === "Enter") go(); }; $("#code").focus();
    } else if (st.step === 1) {
      app.innerHTML = `${bar(1)}<h1>${T("Өз атыңызды таңдаңыз", "Выберите своё имя")}</h1><p class="mut">${esc(st.gname)}</p>
        ${st.list.length > 12 ? `<input type="search" id="q" placeholder="${T("Іздеу…", "Поиск…")}" style="margin-bottom:10px">` : ""}
        <div class="names" id="nm"></div><p><a href="#" id="bk">← ${T("Басқа топ", "Другая группа")}</a></p>`;
      const fill = q => { $("#nm").innerHTML = st.list.filter(s => !q || s.name.toLowerCase().includes(q)).map(s => `<button data-s="${s.id}">${esc(s.name)}</button>`).join("") || `<div class="empty">${T("Тізім бос — оқытушыға айтыңыз", "Список пуст — скажите преподавателю")}</div>`;
        $$("[data-s]").forEach(b => b.onclick = () => { st.pick = st.list.find(x => x.id === b.dataset.s); st.pin = ""; st.step = 2; draw(); }); };
      fill(""); const q = $("#q"); if (q) q.oninput = () => fill(q.value.trim().toLowerCase());
      $("#bk").onclick = e => { e.preventDefault(); st.step = 0; draw(); };
    } else {
      app.innerHTML = `${bar(2)}<h1>PIN</h1><p class="mut">${esc(st.pick.name)} · ${T("4 сан, оқытушы берген", "4 цифры, выдал преподаватель")}</p>
        <div class="pin">${[0, 1, 2, 3].map(i => `<i class="${st.pin.length > i ? "f" : ""}">${st.pin.length > i ? "•" : ""}</i>`).join("")}</div><div class="err" id="err"></div>
        <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join("")}<button data-k="b">⌫</button><button data-k="0">0</button><button data-k="x" style="font-size:15px">${T("Артқа", "Назад")}</button></div>`;
      const press = async k => {
        if (k === "x") { st.step = 1; return draw(); }
        if (k === "b") { st.pin = st.pin.slice(0, -1); return draw(); }
        if (st.pin.length >= 4) return; st.pin += k; draw();
        if (st.pin.length === 4) {
          try { await DB.auth.student(st.pick.email, pwFor(st.pin));
            LS.set("me", {gid: st.gid, sid: st.pick.id, name: st.pick.name, gname: st.gname, code: st.code}); location.hash = "#/me";
          } catch (e) { st.pin = ""; draw(); $("#err").textContent = /network/.test(e.code || "") ? T("Байланыс жоқ", "Нет связи") : /too-many/.test(e.code || "") ? T("Тым көп әрекет. 1 минут күтіңіз.", "Слишком много попыток. Подождите минуту.") : T("PIN қате. Оқытушыдан сұраңыз.", "Неверный PIN. Спросите у преподавателя."); }
        } };
      $$("[data-k]").forEach(b => b.onclick = () => press(b.dataset.k));
      document.onkeydown = e => { if (location.hash !== "#/s") { document.onkeydown = null; return; } if (/^\d$/.test(e.key)) press(e.key); if (e.key === "Backspace") press("b"); };
    }
  };
  draw();
}

/* ============ Студент: кабинет ============ */
function studentHome(me) {
  app.innerHTML = `<div style="display:flex;align-items:center;gap:10px"><div style="flex:1"><h1 style="margin:0">${esc(me.name)}</h1><div class="mut">${esc(me.gname)}</div></div><button class="btn ghost sm" id="out">${T("Шығу", "Выйти")}</button></div>
    <div id="live"></div>

    const md = modal(`<div class="mh"><h2>${T("Студенттер қосу", "Добавить студентов")}</h2><button class="btn ghost sm" data-x>✕</button></div>
      <p class="mut small">${T("Excel-ден аты-жөндер бағанын көшіріп қойыңыз — әр жолға бір студент. Әрқайсысына 4 санды PIN автоматты беріледі.", "Скопируйте столбец ФИО из Excel и вставьте — по одному студенту в строке. Каждому автоматически выдаётся PIN из 4 цифр.")}</p>
      <textarea id="ta" placeholder="Ахметов Ержан&#10;Иванова Анна&#10;…"></textarea><div id="pr" class="mut small" style="margin:8px 0"></div><button class="btn wide" id="ok">${T("Қосу", "Добавить")}</button>`);
    md.el.querySelector("#ok").onclick = async () => {
      const names = md.el.querySelector("#ta").value.split(/\r?\n/).map(x => x.split("\t")[0].replace(/\s+/g, " ").trim()).filter(x => x && x.length < 60);
      const have = new Set(studs.map(s => s.name.toLowerCase())), todo = names.filter(n => !have.has(n.toLowerCase())); if (!todo.length) { toast(T("Жаңа аты жоқ", "Новых имён нет")); return; }
      const ok = md.el.querySelector("#ok"), pr = md.el.querySelector("#pr"); ok.disabled = true; let n = 0;
      for (const name of todo) { const sid = DB.id(), pin = pin4(), email = emailFor(gid, sid);
        try { await DB.auth.create(email, pwFor(pin)); await DB.doc(`groups/${gid}/students/${sid}`).set({name, email, created: Date.now()}); await DB.doc(`groups/${gid}/secrets/${sid}`).set({pin}); n++; }
        catch (e) { pr.innerHTML += `<div style="color:var(--bad)">${esc(name)}: ${esc(e.message)}</div>`; }
        pr.firstChild && pr.firstChild.nodeType === 3 ? pr.firstChild.textContent = `${n} / ${todo.length}` : pr.insertAdjacentText("afterbegin", `${n} / ${todo.length}`); }
      toast(T(`${n} студент қосылды`, `Добавлено студентов: ${n}`)); md.close(); load(); };
  };
  $("#cards").onclick = () => {
    const md = modal(`<div class="mh noprint"><h2>${T("PIN карточкалары", "Карточки с PIN")}</h2><button class="btn sm" id="pp">🖨 ${T("Басып шығару", "Печать")}</button><button class="btn ghost sm" data-x>✕</button></div>
      <div class="cards">${studs.map(s => `<div class="pcard"><b>${esc(s.name)}</b><div class="small">${esc(BASE.replace(/^https?:\/\//, ""))}</div><div class="small">${T("Топ коды", "Код группы")}: <b>${esc(g.code)}</b></div><div class="p">${esc(secrets[s.id] || "????")}</div><div class="small mut">PIN — ${T("ешкімге көрсетпеңіз", "никому не показывайте")}</div></div>`).join("")}</div>`);
    md.el.querySelector("#pp").onclick = () => window.print();
  };
  $("#jr").onclick = () => groupJournal(g, studs);
  load();
}
async function studentCard(gid, s) {
  const md = modal(`<div class="mh"><h2>${esc(s.name)}</h2><button class="btn ghost sm" data-x>✕</button></div><div id="sc"><p class="mut">${T("Жүктелуде…", "Загрузка…")}</p></div>`);
  const [hist, works] = await Promise.all([DB.col(`groups/${gid}/students/${s.id}/hist`).get(), DB.col(`groups/${gid}/students/${s.id}/works`).get()]);
  hist.sort((a, b) => (b.date || 0) - (a.date || 0)); works.sort((a, b) => (b.ts || 0) - (a.ts || 0));
  const vals = hist.map(x => x.p100).filter(x => x != null), avg = vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length) : null;
  md.el.querySelector("#sc").innerHTML = `<div class="card" style="display:flex;gap:14px;align-items:center"><div class="score ${scoreCls(avg)}" style="font-size:22px;padding:10px 14px">${avg != null ? avg : "—"}</div><div><b>${T("Орташа", "Средний балл")}</b><div class="mut small">${hist.length} ${T("сабақ", "занятий")} · ${works.length} ${T("жұмыс", "работ")}</div></div></div>
    <div class="list">${hist.map(x => `<details class="card" style="margin:0"><summary style="cursor:pointer;display:flex;gap:10px;align-items:center"><span class="score ${scoreCls(x.p100)}">${x.p100 != null ? x.p100 : x.score || "—"}</span><b style="flex:1">${esc(x.title)}</b><span class="mut small">${fmtD(x.date)}</span></summary>${taskRows(x)}</details>`).join("") || `<div class="empty">${T("Тарих жоқ", "Истории нет")}</div>`}</div>
    ${works.length ? `<h3 style="margin-top:16px">${T("Жұмыстар", "Работы")}</h3><div class="works">${works.map(w => `<a href="${w.data}" target="_blank" download="${esc(s.name + " — " + (w.task || ""))}.jpg"><img src="${w.data}" loading="lazy"><span><b>${esc(w.task || "")}</b><br>${fmtD(w.ts)}</span></a>`).join("")}</div>` : ""}`;
}
function csvDownload(name, rows) {
  const csv = "﻿" + rows.map(r => r.map(v => { const s = v == null ? "" : String(v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(";")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv;charset=utf-8"})); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function groupJournal(g, studs) {
  const ss = TD.sessions.filter(s => s.gid === g.id).sort((a, b) => (a.date || 0) - (b.date || 0)); toast(T("Журнал дайындалуда…", "Готовлю журнал…"));
  const res = await Promise.all(ss.map(s => DB.col(`sessions/${s.id}/results`).get()));
  const rows = [[T("Аты-жөні", "ФИО"), ...ss.map(s => fmtD(s.date) + " " + s.title), T("Орташа", "Средний")]];
  studs.forEach(st => { const vals = res.map(r => { const x = r.find(y => y.id === st.id); return x ? (x.p100 != null ? x.p100 : x.score) : ""; });
    const nums = vals.filter(v => v !== "" && v != null && !isNaN(v)); rows.push([st.name, ...vals.map(v => v === "" ? "н/б" : v), nums.length ? Math.round(nums.reduce((a, b) => a + +b, 0) / nums.length) : ""]); });
  csvDownload(`${g.name} — журнал.csv`, rows);
}
function tHist() {
  const el = $("#tv"); const f = LS.get("histG") || "";
  const list = TD.sessions.filter(s => !f || s.gid === f);
  el.innerHTML = `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="flex:1;margin:0">${T("Өткен сабақтар", "Прошедшие занятия")}</h2>
    <select id="hf" style="max-width:240px;min-height:40px"><option value="">${T("Барлық топтар", "Все группы")}</option>${TD.groups.map(g => `<option value="${g.id}" ${f === g.id ? "selected" : ""}>${esc(g.name)}</option>`).join("")}</select></div>
    <div class="list" style="margin-top:12px">${list.map(s => `<a class="row" href="#/t/hist/${s.id}"><div class="score ${scoreCls(s.avg)}">${s.avg != null ? s.avg : "—"}</div><div class="t"><b>${esc(s.title)}</b><span class="mut small">${esc(s.gname || "")} · ${esc(modOf(s.slug).name)} · ${fmtDT(s.date)} · ${s.n || 0} ${T("студент", "студ.")}</span></div>${s.status === "live" ? `<span class="chip ok">live</span>` : ""}<span class="mut">›</span></a>`).join("") || `<div class="empty">${T("Әзірге сабақ жоқ", "Занятий пока нет")}</div>`}</div>`;
  $("#hf").onchange = e => { LS.set("histG", e.target.value); tHist(); };
}
async function tSession(id) {
  const el = $("#tv"), s = TD.sessions.find(x => x.id === id); if (!s) { el.innerHTML = `<p class="mut">${T("Жүктелуде…", "Загрузка…")}</p>`; return; }
  el.innerHTML = `<p><a href="#/t/hist">← ${T("Тарих", "История")}</a></p><h2>${esc(s.title)}</h2><div class="mut">${esc(s.gname || "")} · ${esc(modOf(s.slug).name)} · ${fmtDT(s.date)}</div><div id="sv" style="margin-top:10px"><p class="mut">${T("Жүктелуде…", "Загрузка…")}</p></div>`;
  const [res, studs] = await Promise.all([DB.col(`sessions/${id}/results`).get(), DB.col(`groups/${s.gid}/students`).get()]);
  const by = {}; res.forEach(r => by[r.id] = r);
  const roster = studs.filter(x => !x.off || by[x.id]).sort((a, b) => a.name.localeCompare(b.name, "ru"));
  const tasks = (res.find(r => r.tasks) || {}).tasks || [];
  const absent = roster.filter(x => !by[x.id]);
  $("#sv").innerHTML = `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><span class="chip ok">${T("Келді", "Пришли")}: ${res.length}</span><span class="chip ${absent.length ? "warn" : ""}">${T("Келмеді", "Не было")}: ${absent.length}</span>${s.avg != null ? `<span class="chip">${T("Орташа", "Средний")}: ${s.avg}</span>` : ""}
      <button class="btn ghost sm" id="ex">⬇ Excel</button><button class="btn ghost sm" id="wk">🖼 ${T("Жұмыстар", "Работы")}</button>${s.status === "live" ? `<a class="btn sm" target="_blank" href="${withX(`${s.slug}/?host&sess=${s.id}`)}">${T("Пульт", "Пульт")}</a>` : ""}</div>
    <div class="tbw"><table class="tb"><tr><th>${T("Студент", "Студент")}</th><th>/100</th>${tasks.map((t, k) => `<th title="${esc(t.title)}">${k + 1}</th>`).join("")}<th>${T("Пікір", "Комментарии")}</th></tr>
    ${roster.map(st => { const r = by[st.id]; if (!r) return `<tr><td>${esc(st.name)}</td><td colspan="${tasks.length + 2}"><span class="chip warn">${T("келмеді", "не был")}</span></td></tr>`;
      return `<tr><td>${esc(st.name)}</td><td><span class="score ${scoreCls(r.p100)}">${r.p100 != null ? r.p100 : r.score || 0}</span></td>${tasks.map((t, k) => { const x = (r.tasks || [])[k] || {}; return `<td>${x.tg ? `<b>${esc(x.tg)}</b>` : x.ag ? esc(x.ag) : x.done ? "✓" : x.sub ? "▣" : "·"}</td>`; }).join("")}<td class="small">${(r.tasks || []).filter(x => x.cm).map(x => esc(x.cm)).join("; ")}</td></tr>`; }).join("")}</table></div>
    <div id="wv"></div>`;
  $("#ex").onclick = () => csvDownload(`${s.gname || ""} — ${s.title} — ${fmtD(s.date)}.csv`, [[T("Студент", "Студент"), "/100", T("Баға", "Оценка"), ...tasks.map((t, k) => `${k + 1}. ${t.title}`), T("Пікірлер", "Комментарии")],
    ...roster.map(st => { const r = by[st.id]; if (!r) return [st.name, T("н/б", "н/б")]; return [st.name, r.p100 != null ? r.p100 : r.score, r.letter || "", ...tasks.map((t, k) => { const x = (r.tasks || [])[k] || {}; return x.tg || x.ag || (x.done ? "✓" : ""); }), (r.tasks || []).filter(x => x.cm).map(x => x.cm).join("; ")]; })]);
  $("#wk").onclick = async () => { $("#wv").innerHTML = `<p class="mut">${T("Жүктелуде…", "Загрузка…")}</p>`; const ws = await DB.col(`sessions/${id}/works`).get(); ws.sort((a, b) => (a.name || "").localeCompare(b.name || "", "ru") || (a.key || "").localeCompare(b.key || ""));
    $("#wv").innerHTML = ws.length ? `<h3 style="margin-top:14px">${T("Жұмыстар", "Работы")} (${ws.length})</h3><div class="works">${ws.map(w => `<a href="${w.data}" target="_blank" download="${esc(w.name + " — " + w.task)}.jpg"><img src="${w.data}" loading="lazy"><span><b>${esc(w.name)}</b><br>${esc(w.task || "")}</span></a>`).join("")}</div>` : `<div class="empty">${T("Жұмыс жоқ", "Работ нет")}</div>`; };
}

DB.ready.then(() => { route(); DB.auth.onChange(() => { if (/^#\/t/.test(location.hash)) route(); }); }).catch(e => app.innerHTML = `<div class="card">${esc(e.message || e)}</div>`);
</script>
</body>
